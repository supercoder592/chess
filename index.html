<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>跟 AI 下棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="page-title">♟ 西洋棋練習場</h1>
    <p id="status-line" class="sub">載入模型中…</p>
  </header>

  <!-- 主畫面：三種玩法 -->
  <main id="home-view">
    <button class="mode-card" data-mode="pvp">
      <span class="mode-icon">👥</span>
      <span class="mode-name">人對人 🔒</span>
      <span class="mode-desc">兩個人用同一支手機輪流下，AI 講評、記錄，不下棋（需要密碼）</span>
    </button>
    <button class="mode-card" data-mode="ai">
      <span class="mode-icon">🤖</span>
      <span class="mode-name">人對電腦 🔒</span>
      <span class="mode-desc">照你的棋力自動調難度，會記錄棋譜和棋力進度（需要密碼）</span>
    </button>
    <button class="mode-card boss" data-mode="boss">
      <span class="mode-icon">👹</span>
      <span class="mode-name">魔王關</span>
      <span class="mode-desc">最強的 AI，全力搜尋。不影響棋力；棋譜會回傳給電腦練</span>
    </button>
    <div class="card">
      <p class="muted small">
        棋力：<span id="rating-line">—</span>
        · 難度：<span id="level-line">—</span>
        · GitHub：<span id="github-status">未設定</span>
        · <a href="#" id="settings-link">設定</a>
        · <a href="results.html">查看紀錄</a>
      </p>
    </div>
  </main>

  <main id="game-view" class="hidden">
    <div id="board" class="board"></div>

    <div class="controls">
      <button id="btn-home">🏠 主畫面</button>
      <button id="btn-new-again">再來一局</button>
      <button id="btn-resign" class="danger">認輸</button>
    </div>

    <div id="eval-bar-wrap" class="card">
      <div id="eval-bar"><div id="eval-fill"></div></div>
      <p id="eval-text" class="muted small"></p>
    </div>

    <div class="card">
      <p id="moves-line" class="muted small"></p>
    </div>

    <div class="card">
      <p id="mode-line" class="muted small"></p>
    </div>
  </main>

  <div id="color-overlay" class="overlay hidden">
    <div class="overlay-panel">
      <h2 id="color-title">選邊</h2>
      <p id="color-desc" class="muted small"></p>
      <div class="controls color-choices">
        <button data-color="white">我執白</button>
        <button data-color="black">我執黑</button>
        <button data-color="random">隨機</button>
      </div>
      <div class="controls">
        <button id="color-cancel">取消</button>
      </div>
    </div>
  </div>

  <div id="promo-overlay" class="overlay hidden">
    <div class="overlay-panel promo-panel">
      <p>升變成？</p>
      <div class="promo-choices">
        <button data-p="q">♕</button>
        <button data-p="r">♖</button>
        <button data-p="b">♗</button>
        <button data-p="n">♘</button>
      </div>
    </div>
  </div>

  <div id="result-overlay" class="overlay hidden">
    <div class="overlay-panel result-panel">
      <h2 id="result-title"></h2>
      <p id="result-detail" class="muted"></p>
      <p id="result-save-status" class="muted small"></p>
      <div id="result-commentary"></div>
      <div class="controls">
        <button id="result-replay">看棋局回放</button>
        <button id="result-close">關閉</button>
      </div>
    </div>
  </div>

  <div id="replay-overlay" class="overlay hidden">
    <div class="overlay-panel replay-panel">
      <button id="replay-close" class="close-btn">✕</button>
      <div id="replay-board" class="board"></div>
      <p id="replay-caption" class="muted small"></p>
      <div class="controls">
        <button id="replay-prev">◀ 上一步</button>
        <button id="replay-play">▶ 播放</button>
        <button id="replay-next">下一步 ▶</button>
      </div>
      <div class="controls">
        <button id="replay-gif">下載成 GIF（可存到相簿）</button>
      </div>
      <p id="replay-gif-status" class="muted small"></p>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="overlay-panel">
      <h2>GitHub 自動記錄</h2>
      <p class="muted small">
        設定好之後，每盤棋結束會自動把棋譜、講評、棋力進度寫回你的 GitHub repo。
        Token 只存在這個瀏覽器裡。到 GitHub → Settings → Developer settings →
        Personal access tokens 建立一個有 repo 寫入權限的 token。
      </p>
      <label class="field">
        repo（格式 owner/repo）
        <input id="input-repo" type="text" placeholder="supercoder592/chess">
      </label>
      <label class="field">
        Personal Access Token
        <input id="input-token" type="password" placeholder="ghp_...">
      </label>
      <label class="field toggle-field">
        <input id="input-record-enabled" type="checkbox">
        自動記錄我下的每一局棋（不想被記錄可以關掉，token 還是會留著）
      </label>
      <div class="controls">
        <button id="settings-save">儲存</button>
        <button id="settings-close">關閉</button>
      </div>
      <div class="controls">
        <button id="settings-restore-rating">用 GitHub 上的棋力紀錄覆蓋這台裝置</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="engine/board_render.js"></script>
  <script src="engine/rating.js"></script>
  <script src="engine/commentary.js"></script>
  <script src="engine/github.js"></script>
  <script type="module">
    import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/esm/chess.js";
    window.Chess = Chess;
    import("./app.js");
  </script>
</body>
</html>
